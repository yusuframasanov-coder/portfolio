# Уведомление в приложение GitHub, когда Claude открывает Pull Request.
# PR создаётся от имени владельца, а о своих действиях GitHub не уведомляет —
# поэтому бот оставляет комментарий с упоминанием владельца — в GitHub Mobile это push «Direct Mentions».
name: Уведомление о правке
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  pull-requests: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Комментарий в PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          OWNER: ${{ github.repository_owner }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          gh pr comment "$PR_URL" --body "@$OWNER правка готова к проверке: $TITLE. Откройте вкладку «Files changed». Всё хорошо — нажмите Merge. Нужно исправить — напишите Claude в той же сессии."
