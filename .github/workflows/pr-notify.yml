# Уведомление в приложение GitHub, когда Claude открывает Pull Request.
# PR создаётся от имени владельца, а о своих действиях GitHub не уведомляет —
# поэтому бот оставляет комментарий, и на телефон приходит push.
name: Уведомление о правке
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
permissions:
  pull-requests: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Комментарий в PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "Правка готова к проверке. Откройте вкладку «Files changed». Всё хорошо — нажмите Merge. Нужно исправить — напишите Claude в той же сессии."
